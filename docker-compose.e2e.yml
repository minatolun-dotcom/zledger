# Hermetic E2E stack — keeps the live app (zledger DB) untouched.
#
# Bring up against the isolated zledger_test database:
#   POSTGRES_DB=zledger_test docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d api_e2e web_e2e
#
# The entrypoint runs `alembic upgrade head` + `python -m app.seed` against
# zledger_test on startup, so no live data is ever touched by the Playwright
# global teardown. Point the E2E runner at http://localhost:9091.
#
# Tear down when done:
#   docker compose -f docker-compose.yml -f docker-compose.e2e.yml down

services:
  api_e2e:
    extends:
      file: docker-compose.yml
      service: api
    container_name: zledger_api_e2e_1
    expose:
      - "8000"
    # Export POSTGRES_* so the backup/restore scripts (scripts/backup.sh,
    # the /admin/restore endpoints) target the hermetic zledger_test DB
    # instead of the default `zledger` database.
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-zledger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zledger}
      POSTGRES_DB: ${POSTGRES_DB:-zledger_test}

  web_e2e:
    image: zledger-web:latest
    container_name: zledger_web_e2e_1
    depends_on:
      - api_e2e
    ports:
      - "9091:80"
    volumes:
      - ./frontend/nginx.e2e.conf:/etc/nginx/conf.d/default.conf:ro

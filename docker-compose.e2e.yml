# Hermetic E2E stack — keeps the live app (zledger DB) untouched.
#
# Bring up against the isolated zledger_test database:
#   POSTGRES_DB=zledger_test docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d api_e2e web_e2e
#
# The entrypoint runs `alembic upgrade head` + `python -m app.seed` against
# zledger_test on startup, so no live data is ever touched by the Playwright
# global teardown. Point the E2E runner at http://localhost:9091.
#
# Tear down when done:
#   docker compose -f docker-compose.yml -f docker-compose.e2e.yml down

services:
  api_e2e:
    # Pin an explicit image name. `extends: api` alone auto-names the image
    # `zledger-api`, which is a DIFFERENT image from the one this service runs
    # (`zledger-api_e2e`). Rebuilding with `docker compose build api` therefore
    # produced a stale image and silently dropped source fixes (e.g. the
    # activity.py heartbeat fix) on the next `up -d --force-recreate`. Always
    # (re)build with `docker compose -f docker-compose.yml -f docker-compose.e2e.yml build api_e2e`.
    image: zledger-api_e2e
    extends:
      file: docker-compose.yml
      service: api
    container_name: zledger_api_e2e_1
    expose:
      - "8000"
    # Export POSTGRES_* so the backup/restore scripts (scripts/backup.sh,
    # the /admin/restore endpoints) target the hermetic zledger_test DB
    # instead of the default `zledger` database.
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-zledger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zledger}
      POSTGRES_DB: ${POSTGRES_DB:-zledger_test}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-zledger}:${POSTGRES_PASSWORD:-zledger}@${POSTGRES_HOST:-db}:5432/zledger_test
      # Enable modules/features the E2E suite exercises (hermetic stack, no
      # external NIC calls are made by the page-load/toggle specs).
      EINVOICE_ENABLED: "true"
      EINVOICE_ENV: "sandbox"
      EWAY_BILL_ENABLED: "true"

  web_e2e:
    image: zledger-web:latest
    container_name: zledger_web_e2e_1
    restart: unless-stopped
    depends_on:
      - api_e2e
    ports:
      - "9091:80"
    volumes:
      - ./frontend/nginx.e2e.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      # Probes the proxied API health endpoint so orchestration sees the real
      # state of the web<->api path (not just that nginx is up). Use 127.0.0.1
      # (not `localhost`) — busybox wget resolves localhost to IPv6 [::1], but
      # nginx only listens on IPv4, so `localhost` returns "Connection refused".
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/api/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

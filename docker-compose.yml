# Zledger — full stack: postgres + FastAPI + nginx-served React SPA
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zledger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zledger}
      POSTGRES_DB: ${POSTGRES_DB:-zledger}
    volumes:
      - zledger_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zledger} -d ${POSTGRES_DB:-zledger}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Expose only if you need direct host access to Postgres from outside the compose network.
    # ports:
    #   - "5432:5432"

  api:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Re-composed inside app from these pieces.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-zledger}:${POSTGRES_PASSWORD:-zledger}@db:5432/${POSTGRES_DB:-zledger}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-10080}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME}
      EINVOICE_ENABLED: ${EINVOICE_ENABLED:-false}
      EINVOICE_ENV: ${EINVOICE_ENV:-sandbox}
      EINVOICE_GSTIN: ${EINVOICE_GSTIN:-}
      EINVOICE_CLIENT_ID: ${EINVOICE_CLIENT_ID:-}
      EINVOICE_CLIENT_SECRET: ${EINVOICE_CLIENT_SECRET:-}
      EINVOICE_USERNAME: ${EINVOICE_USERNAME:-}
      EINVOICE_PASSWORD: ${EINVOICE_PASSWORD:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # Google Drive backup (optional)
      GDRIVE_ENABLED: ${GDRIVE_ENABLED:-false}
      GDRIVE_TOKEN_FILE: /backups/gdrive-token.json
      GDRIVE_REMOTE_PATH: ${GDRIVE_REMOTE_PATH:-zledger-backups}
      UPLOADS_DIR: /app/uploads
      # Run migrations on startup, then start uvicorn.
    command: ["sh", "/app/entrypoint.sh"]
    # Only expose to host for direct API/dev access; the `web` container proxies /api by default.
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health').status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - zledger_uploads:/app/uploads
      - zledger_backups:/backups
      - ./scripts/backup.sh:/usr/local/bin/backup.sh:ro
      - type: bind
        source: ./tally/Tally Data
        target: /app/tally-data
        read_only: true

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "9090:80"
    # nginx.conf inside the image serves the SPA and proxies /api -> http://api:8000
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  scheduler:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-zledger}:${POSTGRES_PASSWORD:-zledger}@db:5432/${POSTGRES_DB:-zledger}
      CRON_ENABLED: ${CRON_ENABLED:-true}
      CRON_INTERVAL_MINUTES: ${CRON_INTERVAL_MINUTES:-15}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD}
    command: ["python", "-m", "app.cron_runner"]
    profiles:
      - scheduler

  backup:
    build:
      context: ./backend/backup
    image: zledger-backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-zledger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zledger}
      POSTGRES_DB: ${POSTGRES_DB:-zledger}
      BACKUP_DIR: /backups
      UPLOADS_DIR: /uploads
      RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      # Google Drive (optional)
      GDRIVE_ENABLED: ${GDRIVE_ENABLED:-false}
      GDRIVE_TOKEN_FILE: /backups/gdrive-token.json
      GDRIVE_REMOTE_PATH: ${GDRIVE_REMOTE_PATH:-zledger-backups}
    volumes:
      - zledger_backups:/backups
      - zledger_uploads:/uploads:ro
      - ./scripts/backup.sh:/usr/local/bin/backup.sh:ro
      - ./scripts/rclone-entrypoint.sh:/usr/local/bin/rclone-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/rclone-entrypoint.sh"]
    command: []

volumes:
  zledger_pgdata:
  zledger_uploads:
  zledger_backups:
name: Backend Tests
on:
  push:
    paths:
      - 'backend/**'
  pull_request:
    paths:
      - 'backend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zledger
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install -e "backend[dev]" -e "backend"
      # conftest.py rewrites DATABASE_URL to per-worker zledger_test_gw* DBs and
      # creates them on the fly (postgres superuser), so -n 4 is deadlock-free
      # against the shared postgres service. Plain `pytest` also defaults to -n 4.
      # NB: +psycopg = psycopg v3 (the project's driver); a bare postgresql://
      # defaults to psycopg2 which is NOT installed -> 400+ errors (caught in
      # local simulation, fixed here).
      - name: Run backend test suite (parallel)
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/zledger
        run: |
          cd backend && python -m pytest tests/ -q -n 4

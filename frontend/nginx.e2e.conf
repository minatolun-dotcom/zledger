server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Reverse proxy API to the e2e backend container (hermetic stack)
    location /api/ {
        # Re-resolve api_e2e on each request via Docker's embedded DNS
        # (127.0.0.11). nginx normally caches the upstream IP at startup, so a
        # restarted api_e2e (its IP can change) left the proxy pointing at a
        # dead endpoint -> a 502 storm and, under sustained load, an nginx exit
        # (255). Using a variable upstream + resolver makes nginx re-resolve
        # after every api_e2e restart, so the proxy self-heals with no need to
        # restart web_e2e.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream api_e2e;
        proxy_pass http://$upstream:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 90s;
        proxy_next_upstream error timeout http_502 http_503 http_504 non_idempotent;
    }
}

 server {
     listen 80;
     server_name _;
     root /usr/share/nginx/html;
     index index.html;

     # Allow large Tally XML/archive uploads (some ALLVOUCHER files are 180MB+)
     client_max_body_size 500M;

    # Gzip
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # SPA fallback: serve index.html for client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed assets (Vite adds content hash to filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Never cache index.html (acts as cache-buster)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Reverse proxy API to the backend container
    location /api/ {
        # Re-resolve `api` on each request via Docker's embedded DNS
        # (127.0.0.11). nginx caches the upstream IP at startup, so a restarted
        # backend (its IP can change) left the proxy dead until web was also
        # restarted. Using a variable upstream + resolver makes it self-heal.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream api;
        proxy_pass http://$upstream:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 90s;
        proxy_next_upstream error timeout http_502 http_503 http_504 non_idempotent;
    }
}
